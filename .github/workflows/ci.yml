name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; it never needs a token that can write.
permissions:
  contents: read

jobs:
  secrets:
    # The benchmark corpus copies code from public pull requests, so it can carry
    # someone else's credentials. Scan the tree and the commits being added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: scan the tree
        run: '"$RUNNER_TEMP/gitleaks" dir --no-banner --redact .'
      - name: scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A force push or a new branch has no usable base: scan the whole history.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..HEAD"; else range="HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .

  benchmark:
    # Benchmark A is deterministic: a change to what the rules report on the labeled corpus
    # fails here until the new results are reviewed and committed with the change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: benchmark A matches bench/results (synthetic set must stay perfect)
        run: node bench/runner/corpus.ts --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: tests with coverage (instrumented, so timing budgets get a wide margin)
        run: pnpm -r --no-bail test:coverage
        env:
          CHEATGUARD_PERF_FACTOR: "10"
      - name: performance budgets (uninstrumented; shared runners get 3x margin)
        run: pnpm --filter @cheatguard/core exec vitest run test/perf.test.ts
        env:
          CHEATGUARD_PERF_FACTOR: "3"
      - name: dogfood (cheatguard checks its own PR diff)
        if: github.event_name == 'pull_request'
        run: node packages/cli/dist/bin.js check --base origin/${{ github.base_ref }} --format pretty
